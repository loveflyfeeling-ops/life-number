<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生命靈數盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 左側輸入與紀錄、右側命盤（含 0 的九宮格為主視覺，○先天 △後天 □生命數）＋分頁解讀；窄螢幕單欄 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b2430; --muted:#5d6876; --line:#d3dae2;
  --accent:#2f5d8a; --accent-soft:#e1eaf3; --gold:#a8792a; --gold-soft:#f4ead8; --warn:#b5482f; --warn-soft:#f7e3dd; --on:#ffffff;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a212b; --ink:#e6ebf1; --muted:#9aa6b4; --line:#2c3644;
  --accent:#7fb0de; --accent-soft:#1f3248; --gold:#e0b064; --gold-soft:#3a2f1c; --warn:#ec8a6f; --warn-soft:#3b2420; --on:#0f141a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a212b; --ink:#e6ebf1; --muted:#9aa6b4; --line:#2c3644;
  --accent:#7fb0de; --accent-soft:#1f3248; --gold:#e0b064; --gold-soft:#3a2f1c; --warn:#ec8a6f; --warn-soft:#3b2420; --on:#0f141a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1120px;margin:0 auto 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,34px);margin:0;letter-spacing:.04em}
header.top p{margin:0;color:var(--muted)}
h2{font-family:var(--display);font-size:20px;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-size:16px;margin:18px 0 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
aside{display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:2px}
form{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:6px}
.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;color:var(--ink);font-size:14px}
.seg input{position:absolute;opacity:0;width:1px}
.seg input:checked+span{color:var(--accent);font-weight:700}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.btns{display:flex;gap:8px}.btns button{flex:1}
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.recs li{display:flex;align-items:center;gap:6px}
.recs button.load{flex:1;text-align:left;border:none;padding:6px 8px;background:transparent}
.recs button.load:hover{background:var(--accent-soft)}
.recs .del{border:none;color:var(--muted);padding:4px 8px;background:transparent}
.recs small{color:var(--muted);font-family:var(--mono);margin-left:6px}
.empty{color:var(--muted);font-size:13px}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:640px){.chart{grid-template-columns:minmax(0,1fr)}}
.who{font-size:13px;color:var(--muted)}
.who b{color:var(--ink);font-size:16px;font-family:var(--display)}
.big{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:8px 0 4px}
.big .main{font-family:var(--display);font-size:84px;line-height:1;font-weight:900;color:var(--gold)}
.big dl{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:14px}
.big dt{color:var(--muted)} .big dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kw{display:inline-block;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.formula{font-family:var(--mono);font-size:13px;color:var(--muted);word-break:break-all;margin:8px 0 0}
.board{display:flex;flex-direction:column;align-items:center;gap:6px;width:252px;max-width:100%}
.grid9{position:relative;width:252px;height:252px;max-width:100%}
.grid9 svg{position:absolute;inset:0;width:100%;height:100%}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.n{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;color:var(--muted);border:1px dashed var(--line);background:var(--surface);position:relative;z-index:1}
.cell.on .n,.zero.on .n{color:var(--ink);border:2px solid var(--accent);font-weight:500}
.cell.main .n{background:var(--gold);border-color:var(--gold);color:var(--on)}
.marks{font-family:var(--mono);font-size:11px;color:var(--accent);min-height:15px;letter-spacing:.04em;position:relative;z-index:1;background:var(--surface);padding:0 3px;border-radius:3px}
.zero{display:flex;align-items:center;gap:8px}
.zero .n{width:40px;height:40px;font-size:18px}
.legend{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 9px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.prose{max-width:68ch}
.prose p{margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card h4{margin:0 0 4px;font-family:var(--display);font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card.hit{border-color:var(--accent);background:var(--accent-soft)}
.card.hit p{color:var(--ink)}
.card ul{margin:6px 0 0;padding-left:1.1em;font-size:14px}
.tag{font-family:var(--mono);font-size:12px;color:var(--accent)}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;border:1px solid currentColor;margin-left:4px}
.pill.warn{color:var(--warn)} .pill.ok{color:var(--accent)} .pill.gold{color:var(--gold)}
.swatch{display:flex;gap:14px;align-items:center}
.swatch .chip{width:56px;height:56px;border-radius:8px;border:1px solid var(--line);flex:none}
table{border-collapse:collapse;width:100%;font-size:14px}
.tbl{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.now td{background:var(--gold-soft)}
tr.lack td{background:var(--warn-soft)}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.ul{margin:0;padding-left:1.2em}
.ul li{margin-bottom:4px}
.combo{font-family:var(--mono);font-size:18px;color:var(--gold);letter-spacing:.08em}
.kv{display:grid;grid-template-columns:7em minmax(0,1fr);gap:6px 12px;margin:0}
.kv dt{color:var(--muted);font-size:14px}.kv dd{margin:0}
.hero-year{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.hero-year .yn{font-family:var(--display);font-size:56px;font-weight:900;color:var(--gold);line-height:1}
.goalbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.goalbar button[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.nums{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.nums .hl{color:var(--gold);font-weight:500}
@media (prefers-reduced-motion:no-preference){.cell.on .n{transition:transform .2s}.cell.on:hover .n{transform:scale(1.06)}}
</style>
</head>
<body>

<header class="top">
  <h1>生命靈數盤</h1>
  <p>輸入西元生日，排出先天、後天、生命靈動數九宮命盤與十大解析</p>
</header>

<div class="wrap">
<aside>
  <section class="panel">
    <h2>問測者資料</h2>
    <form id="f">
      <div class="field"><label for="nm">姓名</label><input id="nm" placeholder="可留空"></div>
      <div>
        <label>出生日期（西元）</label>
        <div class="row">
          <select id="yy" aria-label="年"></select>
          <select id="mm" aria-label="月"></select>
          <select id="dd" aria-label="日"></select>
        </div>
      </div>
      <div class="seg" role="radiogroup" aria-label="性別">
        <label><input type="radio" name="sx" id="sx-m" value="男" checked><span>男</span></label>
        <label><input type="radio" name="sx" id="sx-f" value="女"><span>女</span></label>
      </div>
      <div class="field"><label for="base">流年基準日期</label><input type="date" id="base"></div>
      <div class="btns">
        <button type="submit" class="primary">排盤</button>
        <button type="button" id="save">存入紀錄</button>
      </div>
    </form>
  </section>
  <section class="panel">
    <h2>問測紀錄</h2>
    <ul class="recs" id="recs"></ul>
    <p class="note">紀錄只存在這台裝置的瀏覽器中。</p>
  </section>
</aside>

<main>
  <section class="panel">
    <div class="chart">
      <div class="board">
        <div class="zero" id="zero"></div>
        <div class="grid9">
          <svg viewBox="0 0 252 252" id="lines" aria-hidden="true"></svg>
          <div class="cells" id="cells"></div>
        </div>
        <div class="legend"><span>○ 先天數</span><span>△ 後天數</span><span>□ 生命靈動數</span><span>虛線＝缺數</span></div>
      </div>
      <div style="min-width:0">
        <div class="who" id="who"></div>
        <div class="big">
          <div class="main" id="mainNum">–</div>
          <dl>
            <dt>先天數 ○</dt><dd id="xian">–</dd>
            <dt>後天數 △</dt><dd id="hou">–</dd>
            <dt>生日數</dt><dd id="bday">–</dd>
            <dt>流年數</dt><dd id="lny">–</dd>
          </dl>
        </div>
        <span class="kw" id="kw"></span>
        <p class="formula" id="formula"></p>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="out"></div>
  </section>
</main>
</div>

function calc(y,m,d,base){
  const str=`${y}${String(m).padStart(2,"0")}${String(d).padStart(2,"0")}`;
  const xian=str.split("").map(Number);
  const hou=dsum(str), houD=String(hou).split("").map(Number), main=red(hou);
  const mk={};D10.forEach(i=>mk[i]={o:0,t:0,s:0});
  xian.forEach(x=>mk[x].o++); houD.forEach(x=>mk[x].t++); mk[main].s++;
  const has=i=>mk[i].o+mk[i].t+mk[i].s>0;
  const lines=LINES.filter(l=>l.k.split("").every(c=>has(+c)));
  const missing=D10.filter(i=>!has(i));
  const by=base.getFullYear();
  const lnY=n=>red(dsum(m)+dsum(d)+dsum(n));
  // 洛書八運：只看先天數
  const xs=new Set(xian);
  const ls=LOSHU.map(([k,nm])=>({k,nm,miss:k.split("").filter(c=>!xs.has(+c))}));
  const freq={};ls.forEach(l=>l.miss.forEach(c=>freq[c]=(freq[c]||0)+1));
  let n1=0,best=-1;Object.keys(freq).sort().forEach(c=>{if(freq[c]>best){best=freq[c];n1=+c}});
  return {str,xian,hou,houD,main,mk,has,bday:red(d),lines,missing,ly:lnY(by),lnY,by,bm:base.getMonth()+1,master:[11,22,33].includes(hou)?hou:null,ls,freq,n1};
}
function perms(a){if(a.length<=1)return [a];const r=[];a.forEach((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).forEach(p=>r.push([x,...p])));return r}
function luckyCombos(R){
  let base=R.missing.filter(x=>x>0);
  if(R.n1&&!base.includes(R.n1))base.unshift(R.n1);
  if(base.length<4){ // 用含 n1 的洛書線補足
    LOSHU.filter(([k])=>k.includes(String(R.n1))).forEach(([k])=>k.split("").forEach(c=>{if(base.length<4&&!base.includes(+c))base.push(+c)}));
  }
  base=base.slice(0,5);
  const all=perms(base).map(p=>p.join(""));
  // 不讓相鄰數字相同、挑分散的 9 組
  const step=Math.max(1,Math.floor(all.length/9));
  return all.filter((_,i)=>i%step===0).slice(0,9);
}

  $("formula").textContent=`${R.xian.join("+")} = ${R.hou}（後天數）→ ${R.houD.join("+")} = ${R.main}（生命靈動數）`;
  $("zero").className="zero"+(R.has(0)?" on":"");
  $("zero").innerHTML=`<span class="n">0</span><span class="marks">${markStr(0)}</span>`;
  const cells=$("cells");cells.innerHTML="";
  [1,4,7,2,5,8,3,6,9].forEach(n=>{const c=document.createElement("div");c.className="cell"+(R.has(n)?" on":"")+(n===R.main?" main":"");
    c.innerHTML=`<span class="n">${n}</span><span class="marks">${markStr(n)}</span>`;cells.appendChild(c)});
  const cc=n=>[pos[n][0]*84+42,pos[n][1]*84+38];
  $("lines").innerHTML=R.lines.map(l=>{const a=cc(+l.k[0]),b=cc(+l.k[l.k.length-1]);return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".5"${l.k.length===2?' stroke-dasharray="6 6"':""}/>`}).join("");
  drawTab();
}

function drawTab(){
  $("tabs").innerHTML=TABS.map((t,i)=>`<button role="tab" aria-selected="${i===tab}" data-i="${i}">${String(i+1).padStart(2,"0")} ${t}</button>`).join("");
  const o=$("out"),M=N[R.main];let h="";
  if(tab===0){
    h=`<div class="prose"><h2>生命靈動數【${R.main}】${M.kw}</h2>
    <p><span class="pill gold">關鍵字</span> ${M.tags}</p>
    <h3>性格特質</h3><p>${M.trait}</p>
    <h3>需要留意的缺點</h3><p>${M.weak}</p>
    <h3>愛情觀</h3><p>${M.love}</p>
    <h3>適合的職業</h3><p>${M.job}</p>
    <h3>一生的目標與使命</h3><p>${M.mission}</p>
    <h3>做人處事之道</h3><dl class="kv"><dt>學習方向</dt><dd>${M.learn}</dd><dt>溝通之道</dt><dd>${M.talk}</dd><dt>行銷相處法</dt><dd>${M.sell}</dd><dt>開運色彩</dt><dd>${M.color}</dd></dl></div>`;
  }else if(tab===1){
    const ds=[...new Set(R.houD)];
    h=`<div class="prose"><h2>後天數 ${R.hou} 與生命靈動數 ${R.main}</h2><p>後天數（△）與生命靈動數（□）代表後天要面對的考驗與功課。好的特質善加運用、弱點及早調整，就不容易被命運牽著走。</p></div>
    <div class="cards">${ds.map(x=>x===0?`<div class="card"><h4>九宮中的 △0<span class="tag">忙碌・機緣</span></h4><p>${ZERO.after}</p></div>`:`<div class="card${x===R.main?" hit":""}"><h4>九宮中的 △${x}<span class="tag">${N[x].kw}</span></h4><ul><li>容易出現：${N[x].tags}</li><li>${N[x].learn}</li><li>${N[x].after}</li></ul></div>`).join("")}
    ${ds.includes(R.main)?"":`<div class="card hit"><h4>□${R.main} 生命靈動數<span class="tag">${M.kw}</span></h4><ul><li>${M.learn}</li><li>${M.after}</li></ul></div>`}
    <div class="card"><h4>生日數 ${R.bday}<span class="tag">${N[R.bday].kw}</span></h4><p>出生日 ${P.d} 日化約而來，代表與生俱來的小天賦：${N[R.bday].trait.split("，")[0]}。</p></div></div>`;
  }else if(tab===2){
    h=`<h2>先、後天與生命數九宮連線</h2><p class="prose">把先天數（○）、後天數（△）、生命靈動數（□）放入九宮，三格都有數字就形成連線，代表一生中特別容易發揮的機會點。你有 <b>${R.lines.length}</b> 條連線。</p>
    <div class="cards">${LINES.map(l=>{const on=R.lines.includes(l);return `<div class="card${on?" hit":""}"><h4>${l.k.split("").join("-")}　${l.alias}${on?'<span class="pill ok">已連線</span>':""}</h4><p>${l.name}：${l.d}</p></div>`}).join("")}</div>`;
  }else if(tab===3){
    const tri=D10.filter(i=>R.mk[i].t), lack=R.missing;
    const rows=[...new Set([...tri,R.main,...lack])];
    h=`<h2>從命盤九宮看先天潛在病源</h2>
    <dl class="kv" style="margin-bottom:12px"><dt>三角形 △</dt><dd>${tri.join("、")}　<span class="note">後天容易出狀況，要養生保健</span></dd><dt>正方形 □</dt><dd>${R.main}　<span class="note">一輩子要維護的部位</span></dd><dt>缺數</dt><dd>${lack.join("、")||"無"}　<span class="note">可用食療、營養或顏色補強</span></dd></dl>
    <div class="tbl"><table><thead><tr><th>數字</th><th>類別</th><th>五行</th><th>對應部位</th><th>容易出現</th><th>保養之道</th></tr></thead><tbody>
    ${rows.map(i=>{const t=lack.includes(i)?"缺數":i===R.main&&!R.mk[i].t?"□":R.mk[i].t&&i===R.main?"△□":"△";const g=ORGAN[i];return `<tr class="${lack.includes(i)?"lack":"now"}"><td class="num">${i}</td><td>${t}</td><td>${g[0]}</td><td>${g[1]}</td><td>${g[2]}</td><td>${g[3]}</td></tr>`}).join("")}
    </tbody></table></div>
    <h3>五行與健康運勢</h3><p class="prose">五行之氣有缺，或同一行數字出現三次以上，都代表氣場失衡，運勢與健康容易受影響。</p>
    <div class="tbl"><table><thead><tr><th>五行</th><th>數字</th><th>臟腑</th><th>代表</th><th>情緒</th><th>調和</th><th>你的數量</th></tr></thead><tbody>
    ${WX.map(w=>{const ds=w[1].split("、").map(Number);const c=ds.reduce((a,x)=>a+R.mk[x].o+R.mk[x].t+R.mk[x].s,0);return `<tr class="${c===0?"lack":c>=3?"now":""}"><td>${w[0]}</td><td class="num">${w[1]}</td><td>${w[2]}</td><td>${w[3]}</td><td>${w[4]}</td><td>${w[5]}</td><td class="num">${c}${c===0?' <span class="pill warn">缺</span>':c>=3?' <span class="pill gold">過旺</span>':""}</td></tr>`}).join("")}
    </tbody></table></div>
    <p class="note">部位對應為生命靈數與五行的傳統說法，僅供參考，不是醫療判斷；身體不適請就醫。</p>`;
  }else if(tab===4){
    const lack=R.missing.filter(x=>x>0);
    h=`<h2>生命秘數與色彩能量</h2><p class="prose">不同顏色有不同能量。生命靈動數的顏色是你的本命色；缺數的顏色可以用在穿著、配件、辦公桌與居家空間，補足欠缺的能量。</p>
    <div class="cards"><div class="card hit"><div class="swatch"><div class="chip" style="background:${M.hex}"></div><div><h4>${M.color}</h4><p class="tag">本命色 □${R.main}</p></div></div><p style="margin-top:8px">${M.cmean}</p></div>
    ${lack.map(n=>`<div class="card"><div class="swatch"><div class="chip" style="background:${N[n].hex}"></div><div><h4>${N[n].color}</h4><p class="tag">補缺數 ${n}</p></div></div><p style="margin-top:8px">${N[n].lack}</p></div>`).join("")}</div>
    ${lack.length?`<h3>補上缺數可以提升</h3><ul class="ul">${lack.map(n=>`<li>${N[n].add}：配戴或擺放 ${N[n].color} 開運小物、使用含 ${n} 的數字</li>`).join("")}</ul>`:"<p>九宮數字齊全，維持本命色即可。</p>"}`;
  }else if(tab===5){
    const Y=YEAR[R.ly];
    h=`<h2>用生命靈數分析流年、流月運勢</h2>
    <div class="hero-year"><div class="yn">${R.ly}</div><div><b>${R.by} 年流年走到【${R.ly} ${Y.n}】</b><p class="formula" style="margin:0">流年數 = ${P.m}月 + ${P.d}日 + ${R.by}，各位數相加化約</p></div></div>
    <p class="prose">${Y.d}</p>
    <h3>從業務角度看 ${R.ly} 號流年</h3><ul class="ul">${Y.biz.map(x=>`<li>${x}</li>`).join("")}</ul>
    <h3>${R.by} 年流月</h3><div class="tbl"><table><thead><tr><th>月份</th><th>流月數</th><th>月運</th><th>說明</th></tr></thead><tbody>
    ${Array.from({length:12},(_,i)=>{const n=red(R.ly+i+1);return `<tr${i+1===R.bm?' class="now"':""}><td class="num">${i+1} 月</td><td class="num">${n}</td><td>${MONTH[n][0]}</td><td>${MONTH[n][1]}</td></tr>`}).join("")}
    </tbody></table></div>
    <h3>九年循環</h3><div class="tbl"><table><thead><tr><th>年份</th><th>流年數</th><th>階段</th></tr></thead><tbody>
    ${[-1,0,1,2,3,4,5,6,7].map(k=>{const yy=R.by+k,n=R.lnY(yy);return `<tr${k===0?' class="now"':""}><td class="num">${yy}</td><td class="num">${n}</td><td>${YEAR[n].n}</td></tr>`}).join("")}
    </tbody></table></div>`;
  }else if(tab===6){
    const combos=luckyCombos(R);
    h=`<h2>運用數字改運建議</h2>
    <p class="prose">把先天數放進洛書九宮（任一行、列、斜線相加都是 15），八條線代表人生八大運。每條線缺少的數字，就是需要後天補強的地方。</p>
    <div class="tbl"><table><thead><tr><th>洛書線</th><th>位置</th><th>缺數</th></tr></thead><tbody>
    ${R.ls.map(l=>`<tr class="${l.miss.length?"lack":""}"><td class="num">${l.k.split("").join("-")}</td><td>${l.nm}</td><td class="num">${l.miss.join("")||"齊全"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="formula">缺數排列：${R.ls.map(l=>l.miss.join("")).filter(Boolean).join(" ")||"無"}</p>
    <h3>一生最幸運數字</h3>
    <p>${R.n1?`<span class="combo" style="font-size:32px">${R.n1}</span>　在八大運中最常出現的缺數，補上它的效果最大。`:"八大運都齊全，以生命靈動數 "+R.main+" 為幸運數。"}</p>
    <h3>開運數字組合</h3><p class="combo">${combos.join("　")}</p>
    <p class="note">由九宮缺數與最幸運數字排列而成，可用在手機號碼、車牌、密碼、帳號或門牌尾數。</p>`;
  }else if(tab===7){
    const g=GOALS[goalSel];
    const score=c=>{const s=c.split("").map(Number);return (s.includes(R.main)?1:0)+(s.includes(R.n1)?1:0)+s.filter(x=>R.missing.includes(x)).length};
    const top=g.c.filter(c=>score(c)>0).sort((a,b)=>score(b)-score(a)).slice(0,6);
    h=`<h2>心想事成數字之組合</h2><p class="prose">選擇想加強的願望，在個人證件或各種數字組合中，盡量從下列吉祥組合中挑選。</p>
    <div class="goalbar" id="goalbar">${GOALS.map((x,i)=>`<button type="button" data-g="${i}" aria-pressed="${i===goalSel}">${x.t}</button>`).join("")}</div>
    <h3>${g.t}・為你推薦</h3>
    <p>${top.length?`<span class="combo">${top.join("　")}</span>`:"—"}</p>
    <p class="note" style="margin-top:2px">推薦依據：含生命靈動數 ${R.main}、最幸運數字 ${R.n1||"—"} 或缺數的組合優先。</p>
    <h3>全部組合（${g.c.length} 組）</h3>
    <div class="nums">${g.c.map(c=>`<span class="${top.includes(c)?"hl":""}">${c}</span>`).join("")}</div>`;
  }else{
    const z=zodiac(P.m,P.d), dn=red(P.d), card=P.d<=21?P.d:(P.d===22?0:dsum(P.d));
    h=`<div class="prose"><h2>用西方觀點看你的一生特質</h2>
    <dl class="kv"><dt>星座</dt><dd>${z[0]}（守護星 ${z[1]}）</dd><dt>生日數字</dt><dd>${P.d} 日 → ${dn}，受${N[dn].planet}影響，${N[dn].west}</dd><dt>生命數</dt><dd>${R.main}（${N[R.main].planet}）</dd><dt>塔羅象意</dt><dd>${card} 號牌「${TAROT[card]}」</dd></dl>
    <h3>一生總合特質</h3><p>${P.m}月${P.d}日出生的人，同時帶有${z[0]}與數字 ${dn} 的特質。${N[dn].trait}再加上生命數 ${R.main} 的「${N[R.main].kw}」，${N[R.main].mission}</p>
    <h3>別人看你的優點</h3><p>${N[dn].tags.split("、").slice(0,3).join("、")}。</p>
    <h3>別人看你的缺點</h3><p>${N[dn].tags.split("、").slice(-2).join("、")}。</p>
    <h3>良心建議</h3><p>${N[dn].learn}${N[R.main].learn}</p>
    ${R.master?`<h3>卓越數 ${R.master}</h3><p>你的後天數是西方數字學的卓越數，代表較高的潛能與相對的壓力：${R.master===11?"11 是直覺與啟發者，敏感而具感召力":R.master===22?"22 是大建築師，能把遠大理想落實":"33 是大師導師，以愛與服務影響他人"}。</p>`:""}
    <h3>適合的戀愛與交友對象</h3><p>生日數字為 <b>${[...new Set([dn,(dn+3-1)%9+1,(dn+6-1)%9+1])].join("、")}</b> 的人與你最合拍（同一三分組），例如 ${[...new Set([dn,(dn+3-1)%9+1,(dn+6-1)%9+1])].map(k=>`${k}、${k+9}${k+18<=31?"、"+(k+18):""} 日`).join("；")} 出生。</p></div>`;
  }
  o.innerHTML=h;
  const gb=$("goalbar");if(gb)gb.addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;goalSel=+b.dataset.g;drawTab()});
}

/* ===== 紀錄 ===== */
const KEY="lifenum-records";
function getRecs(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function setRecs(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function drawRecs(){
  const a=getRecs(),ul=$("recs");
  if(!a.length){ul.innerHTML=`<li class="empty">還沒有紀錄。排盤後按「存入紀錄」即可保存。</li>`;return}
  ul.innerHTML=a.map((r,i)=>`<li><button class="load" data-i="${i}">${esc(r.name||"未填姓名")}<small>${r.y}/${r.m}/${r.d}</small></button><button class="del" data-del="${i}" aria-label="刪除">×</button></li>`).join("");
}
$("recs").addEventListener("click",e=>{
  const a=getRecs();
  if(e.target.closest("[data-del]")){const i=+e.target.closest("[data-del]").dataset.del;a.splice(i,1);setRecs(a);drawRecs();return}
  const b=e.target.closest(".load");if(!b)return;const r=a[+b.dataset.i];
  $("nm").value=r.name;$("yy").value=r.y;$("mm").value=r.m;fillDays();$("dd").value=r.d;$(r.sx==="女"?"sx-f":"sx-m").checked=true;render();
});
$("save").addEventListener("click",()=>{render();const a=getRecs().filter(r=>!(r.name===P.name&&r.y===P.y&&r.m===P.m&&r.d===P.d));a.unshift(P);setRecs(a.slice(0,50));drawRecs();$("save").textContent="已存入";setTimeout(()=>$("save").textContent="存入紀錄",1400)});

/* ===== 表單 ===== */
function opts(el,a,b){el.innerHTML="";for(let i=a;i<=b;i++)el.add(new Option(i,i))}
function fillDays(){const y=+$("yy").value,m=+$("mm").value,cur=+$("dd").value||1;const max=new Date(y,m,0).getDate();opts($("dd"),1,max);$("dd").value=Math.min(cur,max)}
opts($("yy"),1921,2060);opts($("mm"),1,12);
$("yy").value=1990;$("mm").value=8;fillDays();$("dd").value=15;$("nm").value="範例";
const t=new Date();$("base").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
$("yy").addEventListener("change",()=>{fillDays();render()});$("mm").addEventListener("change",()=>{fillDays();render()});
["dd","base"].forEach(id=>$(id).addEventListener("change",render));
document.querySelectorAll("input[name=sx]").forEach(r=>r.addEventListener("change",render));
$("f").addEventListener("submit",e=>{e.preventDefault();render()});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;tab=+b.dataset.i;drawTab()});
render();drawRecs();
</script>
