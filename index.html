<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生命靈數盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 左側輸入與紀錄、右側命盤（九宮格為主視覺）＋分頁解讀；窄螢幕單欄堆疊 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b2430; --muted:#5d6876; --line:#d3dae2;
  --accent:#2f5d8a; --accent-soft:#e1eaf3; --gold:#a8792a; --gold-soft:#f4ead8; --on:#ffffff;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a212b; --ink:#e6ebf1; --muted:#9aa6b4; --line:#2c3644;
  --accent:#7fb0de; --accent-soft:#1f3248; --gold:#e0b064; --gold-soft:#3a2f1c; --on:#0f141a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a212b; --ink:#e6ebf1; --muted:#9aa6b4; --line:#2c3644;
  --accent:#7fb0de; --accent-soft:#1f3248; --gold:#e0b064; --gold-soft:#3a2f1c; --on:#0f141a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1120px;margin:0 auto 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,34px);margin:0;letter-spacing:.04em}
header.top p{margin:0;color:var(--muted)}
h2{font-family:var(--display);font-size:20px;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-size:16px;margin:16px 0 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
aside{display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:2px}
form{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:6px}
.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;color:var(--ink);font-size:14px}
.seg input{position:absolute;opacity:0;width:1px}
.seg input:checked+span{color:var(--accent);font-weight:700}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.btns{display:flex;gap:8px}.btns button{flex:1}
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.recs li{display:flex;align-items:center;gap:6px}
.recs button.load{flex:1;text-align:left;border:none;padding:6px 8px;background:transparent}
.recs button.load:hover{background:var(--accent-soft)}
.recs .del{border:none;color:var(--muted);padding:4px 8px;background:transparent}
.recs small{color:var(--muted);font-family:var(--mono);margin-left:6px}
.empty{color:var(--muted);font-size:13px}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:620px){.chart{grid-template-columns:minmax(0,1fr)}}
.who{font-size:13px;color:var(--muted)}
.who b{color:var(--ink);font-size:16px;font-family:var(--display)}
.big{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:8px 0 4px}
.big .main{font-family:var(--display);font-size:84px;line-height:1;font-weight:900;color:var(--gold)}
.big dl{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:14px}
.big dt{color:var(--muted)} .big dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kw{display:inline-block;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.formula{font-family:var(--mono);font-size:13px;color:var(--muted);word-break:break-all}
.grid9{position:relative;width:228px;height:228px;max-width:100%}
.grid9 svg{position:absolute;inset:0;width:100%;height:100%}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.cell{display:flex;align-items:center;justify-content:center;position:relative}
.cell .n{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;color:var(--muted);border:1px dashed var(--line);background:var(--surface);position:relative;z-index:1}
.cell.on .n{color:var(--ink);border:2px solid var(--accent);font-weight:500}
.cell.main .n{background:var(--gold);border-color:var(--gold);color:var(--on)}
.cell .cnt{position:absolute;top:6px;right:10px;font-family:var(--mono);font-size:11px;color:var(--accent);z-index:2}
.legend{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.prose{max-width:68ch}
.prose p{margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card h4{margin:0 0 4px;font-family:var(--display);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card.hit{border-color:var(--accent);background:var(--accent-soft)}
.card.hit p{color:var(--ink)}
.tag{font-family:var(--mono);font-size:12px;color:var(--accent)}
.swatch{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.swatch .chip{width:64px;height:64px;border-radius:8px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tbl{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.now td{background:var(--gold-soft)}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.ul{margin:0;padding-left:1.2em}
.combo{font-family:var(--mono);font-size:18px;color:var(--gold);letter-spacing:.08em}
@media (prefers-reduced-motion:no-preference){.cell.on .n{transition:transform .2s}.cell.on:hover .n{transform:scale(1.06)}}
</style>
</head>
<body>

<header class="top">
  <h1>生命靈數盤</h1>
  <p>輸入西元生日，算出主命數、九宮連線、流年流月與開運數字組合</p>
</header>

<div class="wrap">
<aside>
  <section class="panel">
    <h2>問測者資料</h2>
    <form id="f">
      <div class="field"><label for="nm">姓名</label><input id="nm" placeholder="可留空"></div>
      <div>
        <label>出生日期（西元）</label>
        <div class="row">
          <select id="yy" aria-label="年"></select>
          <select id="mm" aria-label="月"></select>
          <select id="dd" aria-label="日"></select>
        </div>
      </div>
      <div class="seg" role="radiogroup" aria-label="性別">
        <label><input type="radio" name="sx" id="sx-m" value="男" checked><span>男</span></label>
        <label><input type="radio" name="sx" id="sx-f" value="女"><span>女</span></label>
      </div>
      <div class="field"><label for="base">流年基準日期</label><input type="date" id="base"></div>
      <div class="btns">
        <button type="submit" class="primary">排盤</button>
        <button type="button" id="save">存入紀錄</button>
      </div>
    </form>
  </section>
  <section class="panel">
    <h2>問測紀錄</h2>
    <ul class="recs" id="recs"></ul>
    <p class="note">紀錄只存在這台裝置的瀏覽器中。</p>
  </section>
</aside>

<main>
  <section class="panel">
    <div class="chart">
      <div>
        <div class="grid9" id="g9">
          <svg viewBox="0 0 228 228" id="lines" aria-hidden="true"></svg>
          <div class="cells" id="cells"></div>
        </div>
        <div class="legend"><span><i style="background:var(--gold)"></i>主命數</span><span><i style="border:2px solid var(--accent)"></i>出現的數字</span><span><i style="border:1px dashed var(--muted)"></i>空缺數</span></div>
      </div>
      <div style="min-width:0">
        <div class="who" id="who"></div>
        <div class="big">
          <div class="main" id="mainNum">–</div>
          <dl>
            <dt>先天數</dt><dd id="xian">–</dd>
            <dt>後天數</dt><dd id="hou">–</dd>
            <dt>生日數</dt><dd id="bday">–</dd>
            <dt>流年數</dt><dd id="lny">–</dd>
          </dl>
        </div>
        <span class="kw" id="kw"></span>
        <p class="formula" id="formula"></p>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="out"></div>
  </section>
</main>
</div>

].map(g=>({...g,c:g.c.split(" ")}));
let goalSel=0;
const red=n=>{while(n>9)n=String(n).split("").reduce((a,b)=>a+ +b,0);return n};
const dsum=s=>String(s).split("").reduce((a,b)=>a+ +b,0);
const $=id=>document.getElementById(id);
const pos={1:[0,0],4:[1,0],7:[2,0],2:[0,1],5:[1,1],8:[2,1],3:[0,2],6:[1,2],9:[2,2]}; // [col,row]

function calc(y,m,d,base){
  const str=`${y}${String(m).padStart(2,"0")}${String(d).padStart(2,"0")}`;
  const digits=str.split("").map(Number);
  const hou=dsum(str);                // 後天數（總和）
  const main=red(hou);                // 主命數
  const all=[...digits,...String(hou).split("").map(Number),main].filter(x=>x>0);
  const cnt={};for(let i=1;i<=9;i++)cnt[i]=0;all.forEach(x=>cnt[x]++);
  const lines=LINES.filter(l=>l.k.split("").every(c=>cnt[c]>0));
  const missing=[1,2,3,4,5,6,7,8,9].filter(i=>!cnt[i]);
  const by=base.getFullYear();
  const lnY=n=>red(dsum(m)+dsum(d)+dsum(n));
  return {str,digits,hou,main,bday:red(d),cnt,lines,missing,ly:lnY(by),lnY,by,bm:base.getMonth()+1,master:[11,22,33].includes(hou)?hou:null};
}

let R=null, P=null, tab=0;
const TABS=["一生特質","後天與生日數","九宮連線","空缺與養生","色彩能量","流年流月","數字開運","心想事成","西方觀點"];

function render(){
  const y=+$("yy").value,m=+$("mm").value,d=+$("dd").value;
  const bv=$("base").value; const base=bv?new Date(bv+"T00:00"):new Date();
  R=calc(y,m,d,base);
  P={name:$("nm").value.trim(),y,m,d,sx:document.querySelector("input[name=sx]:checked").value};
  $("who").innerHTML=`<b>${esc(P.name||"未填姓名")}</b>　${P.sx}　${y}年${m}月${d}日`;
  $("mainNum").textContent=R.main;
  $("xian").textContent=R.digits.filter(x=>x).join(" ");
  $("hou").textContent=R.hou;
  $("bday").textContent=R.bday;
  $("lny").textContent=`${R.ly}（${R.by}）`;
  $("kw").textContent=`${R.main} 號人・${N[R.main].kw}`;
  $("formula").textContent=`${R.str.split("").join("+")} = ${R.hou} → ${R.main}`;
  // 九宮
  const cells=$("cells");cells.innerHTML="";
  const order=[1,4,7,2,5,8,3,6,9];
  order.forEach(n=>{const c=document.createElement("div");c.className="cell"+(R.cnt[n]?" on":"")+(n===R.main?" main":"");
    c.innerHTML=`<span class="n">${n}</span>${R.cnt[n]>1?`<span class="cnt">×${R.cnt[n]}</span>`:""}`;cells.appendChild(c)});
  const cc=n=>[pos[n][0]*76+38,pos[n][1]*76+38];
  $("lines").innerHTML=R.lines.map(l=>{const a=cc(+l.k[0]),b=cc(+l.k[2]);return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".55"/>`}).join("");
  drawTab();
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function drawTab(){
  $("tabs").innerHTML=TABS.map((t,i)=>`<button role="tab" aria-selected="${i===tab}" data-i="${i}">${t}</button>`).join("");
  const o=$("out"),M=N[R.main];let h="";
  if(tab===0){
    h=`<div class="prose"><h2>主命數 ${R.main}：${M.kw}</h2><p>${M.trait}</p>
    <h3>天賦優勢</h3><p>${M.good}</p><h3>人生課題</h3><p>${M.lesson}</p>
    <h3>適合方向</h3><p>${M.job}</p><h3>感情觀</h3><p>${M.love}</p></div>`;
  }else if(tab===1){
    const hs=String(R.hou).split("").map(Number);
    h=`<div class="prose"><h2>後天數 ${R.hou}</h2><p>後天數是生日所有數字的總和，代表後天發展出的能力與面對外在世界的方式。${hs.length>1?`十位數 <b>${hs[0]}</b> 是外在表現，個位數 <b>${hs[1]}</b> 是內在動力，兩者合成主命數 ${R.main}。`:""}</p></div>
    <div class="cards">${hs.map((x,i)=>x?`<div class="card"><h4>${hs.length>1?(i?"個位":"十位"):"後天"} ${x}<span class="tag">${N[x].kw}</span></h4><p>${N[x].good}</p></div>`:"").join("")}
    <div class="card hit"><h4>生日數 ${R.bday}<span class="tag">${N[R.bday].kw}</span></h4><p>出生日（${P.d} 日）化約而來，代表與生俱來的小天賦：${N[R.bday].good}。</p></div></div>`;
  }else if(tab===2){
    h=`<h2>九宮連線</h2><p class="prose">把先天數、後天數與主命數放入九宮格，三格都出現就形成一條連線，代表比較容易發揮的才能。你有 <b>${R.lines.length}</b> 條連線。</p>
    <div class="cards">${LINES.map(l=>{const on=R.lines.includes(l);return `<div class="card${on?" hit":""}"><h4>${l.name}<span class="tag">${l.k.split("").join("-")}${on?"・已連線":""}</span></h4><p>${l.d}</p></div>`}).join("")}</div>`;
  }else if(tab===3){
    h=`<h2>空缺數與養生關注</h2><p class="prose">${R.missing.length?`九宮中空缺的數字是 <b>${R.missing.join("、")}</b>，代表較需要後天練習的特質。`:"九宮格九個數字都有出現，特質相當全面。"}數字重複越多，該特質越強，也可能用力過猛。</p>
    <div class="tbl"><table><thead><tr><th>數字</th><th>出現次數</th><th>狀態</th><th>傳統對應部位</th><th>建議</th></tr></thead><tbody>
    ${[1,2,3,4,5,6,7,8,9].map(i=>{const c=R.cnt[i];const st=c===0?"空缺":c>=3?"過強":"平衡";const tip=c===0?`多練習：${N[i].good.split("、")[0]}`:c>=3?`留意：${N[i].lesson.split("，")[0]}`:"維持即可";return `<tr${c===0||c>=3?' class="now"':""}><td class="num">${i}</td><td class="num">${c}</td><td>${st}</td><td>${N[i].body}</td><td>${tip}</td></tr>`}).join("")}
    </tbody></table></div><p class="note">部位對應為生命靈數的傳統說法，僅供參考，不是醫療判斷；身體有狀況請諮詢醫師。</p>`;
  }else if(tab===4){
    const ex=[R.main,R.bday,...R.missing.slice(0,2)];const uniq=[...new Set(ex)];
    h=`<h2>色彩能量</h2><div class="cards">${uniq.map(n=>`<div class="card"><div class="swatch"><div class="chip" style="background:${N[n].hex}"></div><div><h4>${N[n].color}</h4><p class="tag">${n===R.main?"主命數":n===R.bday?"生日數":"補足空缺"} ${n}</p></div></div><p style="margin-top:8px">${N[n].cmean}</p></div>`).join("")}</div>
    <p class="note">主命數色可作為日常主色；空缺數色可用在配件、桌面小物上補強能量。</p>`;
  }else if(tab===5){
    const yrs=[-1,0,1,2,3,4,5,6,7].map(k=>R.by+k);
    h=`<h2>流年運勢</h2><p class="formula">流年數 = 出生月 + 出生日 + 流年年份，各位數相加後化約</p>
    <div class="tbl"><table><thead><tr><th>年份</th><th>流年數</th><th>主題</th><th>說明</th></tr></thead><tbody>
    ${yrs.map(yy=>{const n=R.lnY(yy);return `<tr${yy===R.by?' class="now"':""}><td class="num">${yy}</td><td class="num">${n}</td><td>${YEAR[n][0]}</td><td>${YEAR[n][1]}</td></tr>`}).join("")}
    </tbody></table></div>
    <h3>${R.by} 年流月</h3><div class="tbl"><table><thead><tr><th>月</th><th>流月數</th><th>重點</th></tr></thead><tbody>
    ${Array.from({length:12},(_,i)=>{const n=red(R.ly+i+1);return `<tr${i+1===R.bm?' class="now"':""}><td class="num">${i+1} 月</td><td class="num">${n}</td><td>${YEAR[n][0]}：${YEAR[n][1]}</td></tr>`}).join("")}
    </tbody></table></div>`;
  }else if(tab===6){
    const lucky=[R.main,R.bday,R.ly];
    const fill=R.missing;
    h=`<div class="prose"><h2>運用數字改運</h2><p>日常常用的數字（手機末碼、車牌、密碼、門牌、樓層）可以多選用與自己共振的數字，或用來補足空缺數。</p>
    <h3>本命幸運數字</h3><p class="combo">${[...new Set(lucky)].join(" ・ ")}</p><p>主命數 ${R.main}、生日數 ${R.bday}、今年流年數 ${R.ly}。</p>
    <h3>建議補強的數字</h3><p>${fill.length?`<span class="combo">${fill.join(" ・ ")}</span><br>可在日常數字中刻意加入，幫助培養：${fill.map(n=>N[n].kw).join("、")}。`:"沒有空缺數，維持現有平衡即可。"}</p>
    <h3>可補成連線的組合</h3><ul class="ul">${LINES.filter(l=>!R.lines.includes(l)).map(l=>{const need=l.k.split("").filter(c=>!R.cnt[c]);return need.length===1?`<li>加入 <b>${need[0]}</b> 可補成「${l.name}」（${l.k.split("").join("-")}）</li>`:""}).join("")||"<li>目前沒有只差一個數字的連線。</li>"}</ul></div>`;
  }else if(tab===7){
    const g=GOALS[goalSel];
    const score=c=>{const s=c.split("").map(Number);return (s.includes(R.main)?1:0)+s.filter(x=>R.missing.includes(x)).length};
    const top=g.c.filter(c=>score(c)>0).sort((a,b)=>score(b)-score(a)).slice(0,6);
    h=`<h2>心想事成數字之組合</h2><p class="prose">選擇想加強的願望，下方是該願望的吉祥四碼組合，可用在手機末碼、車牌、密碼、證件或各種數字組合中，盡量從中挑選。</p>
    <div class="seg" style="flex-wrap:wrap;margin-bottom:14px" id="goalSeg">${GOALS.map((x,i)=>`<button type="button" data-g="${i}" style="${i===goalSel?"background:var(--accent);color:var(--on);border-color:var(--accent)":""}">${x.t}</button>`).join("")}</div>
    <h3>${g.t}・為你推薦</h3>
    <p>${top.length?`<span class="combo">${top.join("　")}</span>`:"—"}</p>
    <p class="note" style="margin-top:2px">推薦依據：含主命數 ${R.main}${R.missing.length?`或空缺數 ${R.missing.join("、")}`:""} 的組合優先。</p>
    <h3>全部組合（${g.c.length} 組）</h3>
    <div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums">${g.c.map(c=>`<span style="${top.includes(c)?"color:var(--gold);font-weight:500":""}">${c}</span>`).join("")}</div>`;
  }else{
    h=`<div class="prose"><h2>西方畢達哥拉斯觀點</h2><p>${M.west}。</p>
    ${R.master?`<p>你的總和為 <b>${R.master}</b>，在西方數字學中屬於「卓越數（Master Number）」，通常不再化約，代表較高的潛能與相對的壓力：${R.master===11?"11 是直覺與啟發者，敏感而具感召力":R.master===22?"22 是大建築師，能把遠大理想落實":"33 是大師導師，以愛與服務影響他人"}。</p>`:`<p>你的總和 ${R.hou} 不是卓越數（11、22、33），以 ${R.main} 解讀即可。</p>`}
    <p>西方系統著重主命數（Life Path）與生日數（Birthday Number），把人生看作 1 到 9 的循環，每個流年都是這個循環中的一站；東方的九宮連線則更重視數字之間的組合關係。兩者可以互相參照。</p></div>`;
  }
  o.innerHTML=h;
  const gs=$("goalSeg");if(gs)gs.addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;goalSel=+b.dataset.g;drawTab()});
}

// 紀錄
const KEY="lifenum-records";
function getRecs(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function setRecs(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function drawRecs(){
  const a=getRecs(),ul=$("recs");
  if(!a.length){ul.innerHTML=`<li class="empty">還沒有紀錄。排盤後按「存入紀錄」即可保存。</li>`;return}
  ul.innerHTML=a.map((r,i)=>`<li><button class="load" data-i="${i}">${esc(r.name||"未填姓名")}<small>${r.y}/${r.m}/${r.d}</small></button><button class="del" data-del="${i}" aria-label="刪除">×</button></li>`).join("");
}
$("recs").addEventListener("click",e=>{
  const a=getRecs();
  if(e.target.closest("[data-del]")){const i=+e.target.closest("[data-del]").dataset.del;a.splice(i,1);setRecs(a);drawRecs();return}
  const b=e.target.closest(".load");if(!b)return;const r=a[+b.dataset.i];
  $("nm").value=r.name;$("yy").value=r.y;$("mm").value=r.m;fillDays();$("dd").value=r.d;$(r.sx==="女"?"sx-f":"sx-m").checked=true;render();
});
$("save").addEventListener("click",()=>{render();const a=getRecs().filter(r=>!(r.name===P.name&&r.y===P.y&&r.m===P.m&&r.d===P.d));a.unshift(P);setRecs(a.slice(0,50));drawRecs();$("save").textContent="已存入";setTimeout(()=>$("save").textContent="存入紀錄",1400)});

// 表單
function opts(el,a,b){el.innerHTML="";for(let i=a;i<=b;i++)el.add(new Option(i,i))}
function fillDays(){const y=+$("yy").value,m=+$("mm").value,cur=+$("dd").value||1;const max=new Date(y,m,0).getDate();opts($("dd"),1,max);$("dd").value=Math.min(cur,max)}
opts($("yy"),1921,2060);opts($("mm"),1,12);
$("yy").value=1990;$("mm").value=8;fillDays();$("dd").value=15;$("nm").value="範例";
const t=new Date();$("base").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
$("yy").addEventListener("change",()=>{fillDays();render()});$("mm").addEventListener("change",()=>{fillDays();render()});
["dd","base"].forEach(id=>$(id).addEventListener("change",render));
document.querySelectorAll("input[name=sx]").forEach(r=>r.addEventListener("change",render));
$("f").addEventListener("submit",e=>{e.preventDefault();render()});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;tab=+b.dataset.i;drawTab()});
render();drawRecs();
</script>
